<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Moderation · The Midgley Awards</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
.adm h1{font:900 44px/1 var(--display);text-transform:uppercase;margin:0}
.adm h2{font:800 24px/1 var(--display);text-transform:uppercase;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.adm h2 .label{font-size:12px}
.adm section{display:flex;flex-direction:column;gap:0}
.login{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login input{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--surface);padding:9px 11px}
.row{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.row .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.row .top b{font:800 22px/1 var(--display);text-transform:uppercase}
.row p{margin:0;color:var(--ink-2);font-size:14px;max-width:75ch;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px}
.btns .ok{background:var(--ozone);border-color:var(--ozone);color:#fff}
.btns .danger{color:var(--ethyl);border-color:var(--ethyl)}
.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);padding:14px}
.edit .full{grid-column:1/-1}
.edit label{display:flex;flex-direction:column;gap:4px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.edit input,.edit select,.edit textarea{font:14px var(--sans);text-transform:none;letter-spacing:0;color:var(--ink);border:1px solid var(--line);background:var(--ground);padding:7px 9px;width:100%}
.edit textarea{min-height:60px;resize:vertical}
.st-pending{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.st-rejected{background:var(--ethyl-soft);color:var(--ethyl);border-color:transparent}
.empty-row{color:var(--ink-3);font-size:14px;border-top:1px solid var(--line);padding:12px 0}
textarea.subs{width:100%;min-height:120px;font:13px var(--mono);border:1px solid var(--line);background:var(--surface);padding:10px}
</style>
</head>
<body>
<div class="wrap adm">
  <p class="updated" style="font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase"><a href="/">The Midgley Awards</a></p>
  <h1>Moderation</h1>
  <form class="login" id="login">
    <label for="token" class="label">Admin token</label>
    <input id="token" type="password" autocomplete="current-password" placeholder="The ADMIN_TOKEN secret from Cloudflare">
    <button class="primary" type="submit">Unlock</button>
    <button class="ghost" type="button" id="logout" hidden>Lock</button>
  </form>
  <p class="notice" id="notice" hidden></p>
  <div id="panels" hidden style="display:flex;flex-direction:column;gap:36px">
    <section><h2>Waiting for review <span class="label" id="c-pending"></span></h2><div id="pending"></div></section>
    <section><h2>Reported nominees <span class="label" id="c-rnom"></span></h2><div id="rnom"></div></section>
    <section><h2>Flagged comments <span class="label" id="c-flag"></span></h2><div id="flag"></div></section>
    <section><h2>All nominees <span class="label" id="c-all"></span></h2><div id="all"></div></section>
    <section><h2>Email list <span class="label" id="c-subs"></span></h2>
      <div class="btns"><button id="load-subs">Show addresses</button></div>
      <textarea class="subs" id="subs" readonly hidden aria-label="Subscriber emails"></textarea>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/labels.js"></script>
<script src="/admin.js"></script>
</body>
</html>
