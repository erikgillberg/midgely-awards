name: Deploy to Cloudflare Pages

# main is production (backfireawards.com). staging deploys as a preview at
# staging.midgley-awards.pages.dev, which staging.backfireawards.com points to.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the build id into stylesheet and script URLs
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" public/shared.js
      - name: Deploy public/ to the midgley-awards Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 78390fee6fe502f739aea09d836698ef
          command: pages deploy public --project-name=midgley-awards --branch=${{ github.ref_name }} --commit-dirty=true
